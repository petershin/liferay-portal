task runGradleTest

allprojects {
	repositories {
		maven {
			url "https://repository-linode.liferay.com/nexus/content/groups/public"
		}
	}
}

runGradleTest {
	dependsOn ":modules:foo-api:testLiferayTomcatVersion"

	doLast {
		String version = null

		try {
			version = project.property("app.server.tomcat.version")
		}
		catch (Exception exception) {
		}

		assert version == null
	}
}